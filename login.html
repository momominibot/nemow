<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nemow · Enter</title>
<link rel="icon" type="image/png" href="assets/onboarding/egg.png">
<link rel="apple-touch-icon" href="assets/onboarding/egg.png">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
*{ box-sizing:border-box; }
.lwrap{ position:fixed; inset:0; overflow:hidden;
  background:linear-gradient(180deg,#F3E7F0 0%,#F6E9E4 42%,#FAF3EC 100%); }
/* generated mystical sky */
.lsky{ position:absolute; inset:0; background:center/cover no-repeat; opacity:0; transition:opacity 1.4s ease; }
.lsky.on{ opacity:1; }
/* once the painted sky loads, fade the CSS fallbacks so nothing doubles up */
.skyon .aura{ opacity:.22; }
.skyon .geo{ opacity:0; }
/* animated fallback aurora (shows until image loads, and blends under it) */
.aura{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.6; mix-blend-mode:screen; }
.a1{ width:420px;height:420px; top:-120px; left:-90px; background:radial-gradient(circle,#E7B8D8,transparent 68%); animation:drift1 20s ease-in-out infinite; }
.a2{ width:360px;height:360px; top:8%; right:-120px; background:radial-gradient(circle,#E9CE86,transparent 66%); animation:drift2 26s ease-in-out infinite; }
.a3{ width:480px;height:480px; bottom:-160px; left:-40px; background:radial-gradient(circle,#C9B6EC,transparent 70%); animation:drift1 30s ease-in-out infinite reverse; }
@keyframes drift1{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,30px)} }
@keyframes drift2{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-36px,26px)} }
/* sacred geometry */
.geo{ position:absolute; top:-6%; left:50%; width:130vw; max-width:640px; transform:translateX(-50%);
  opacity:.16; animation:spin 90s linear infinite; }
@keyframes spin{ to{ transform:translateX(-50%) rotate(360deg);} }
/* stars */
.stars i{ position:absolute; border-radius:50%; background:radial-gradient(circle,#fff,rgba(255,244,214,.6));
  box-shadow:0 0 7px 1px rgba(255,240,210,.85); animation:tw var(--d,3s) ease-in-out var(--t,0s) infinite; }
@keyframes tw{ 0%,100%{opacity:0;transform:scale(.4)} 50%{opacity:1;transform:scale(1)} }

.lstage{ position:relative; z-index:3; height:100%; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:0 26px calc(30px + env(safe-area-inset-bottom)); text-align:center; }

/* celestial orb + logo */
.orb{ position:relative; width:118px; height:118px; margin-bottom:22px; }
.orb .halo{ position:absolute; inset:-26px; border-radius:50%;
  background:radial-gradient(circle, rgba(233,180,92,.42), rgba(217,131,164,.16) 55%, transparent 72%);
  animation:pulse 4.2s ease-in-out infinite; }
.orb .glass{ position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, rgba(255,255,255,.9), rgba(247,225,240,.6) 45%, rgba(218,206,246,.5));
  box-shadow:0 18px 44px -14px rgba(110,70,84,.45), inset 0 0 30px rgba(255,255,255,.55);
  backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; animation:bob 5.5s ease-in-out infinite; }
.orb svg{ animation:spin 46s linear infinite; }
@keyframes pulse{ 0%,100%{opacity:.5;transform:scale(.96)} 50%{opacity:.95;transform:scale(1.06)} }
@keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }

/* glowing wordmark hero */
.lhero{ position:relative; font-family:var(--serif); font-weight:500; font-size:44px; letter-spacing:.24em; color:var(--mauve);
  padding-left:.24em; margin:6px 0 18px; text-shadow:0 2px 18px rgba(233,180,92,.35); }
.lhalo{ position:absolute; left:50%; top:52%; width:220px; height:120px; transform:translate(-50%,-50%);
  border-radius:50%; background:radial-gradient(circle, rgba(233,180,92,.4), rgba(217,131,164,.14) 55%, transparent 72%);
  z-index:-1; animation:pulse 4.2s ease-in-out infinite; }
.lbrand{ font:800 12px var(--sans); letter-spacing:.42em; color:var(--mauve); margin-bottom:8px; }
.ltitle{ font-family:var(--serif); font-weight:500; font-size:34px; line-height:1.14; color:var(--cocoa); margin:0; }
.ltitle em{ font-style:italic; color:var(--terracotta); }
.lsub{ font:500 13.5px var(--sans); color:var(--taupe); margin:10px 0 26px; max-width:26ch; }

/* glass form card */
.lcard{ width:100%; max-width:360px; padding:22px 20px 20px; border-radius:26px;
  background:rgba(255,255,255,.42); border:1.5px solid rgba(255,255,255,.6);
  box-shadow:0 24px 60px -24px rgba(110,70,84,.4), inset 0 1px 0 rgba(255,255,255,.7);
  backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2); }
.field{ display:flex; align-items:center; gap:11px; background:rgba(255,255,255,.66);
  border:1.5px solid rgba(255,255,255,.7); border-radius:15px; padding:14px 15px; margin-bottom:12px; transition:.18s; }
.field:focus-within{ border-color:var(--lavender); box-shadow:0 0 0 4px rgba(218,206,246,.4); background:rgba(255,255,255,.85); }
.field .ms{ color:var(--faded); font-size:20px; }
.field input{ flex:1; min-width:0; border:none; outline:none; background:transparent; font:500 15px var(--sans); color:var(--ink); }
.field input::placeholder{ color:var(--faded); }
.field .eye{ cursor:pointer; }
.forgot{ display:block; text-align:right; font:700 12px var(--sans); color:var(--terracotta); text-decoration:none; margin:-2px 2px 14px; }
.lbtn{ width:100%; border:none; cursor:pointer; padding:15px; border-radius:99px;
  font:800 15px var(--sans); color:#F8EFE6; letter-spacing:.02em;
  background:linear-gradient(120deg,var(--mauve),#8A5A63 60%,var(--terracotta));
  box-shadow:0 14px 30px -12px rgba(110,70,84,.6); transition:.15s; display:flex; align-items:center; justify-content:center; gap:8px; }
.lbtn:hover{ transform:translateY(-1px); box-shadow:0 18px 36px -12px rgba(110,70,84,.7); }
.ldiv{ display:flex; align-items:center; gap:12px; color:var(--taupe); font-size:11.5px; margin:16px 0 14px; }
.ldiv::before,.ldiv::after{ content:""; flex:1; height:1px; background:rgba(150,105,87,.22); }
.oauth{ display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:99px;
  background:rgba(255,255,255,.7); border:1.5px solid rgba(255,255,255,.7); font:700 13.5px var(--sans);
  color:var(--cocoa); text-decoration:none; transition:.15s; }
.oauth:hover{ background:#fff; }
.lswitch{ font:500 13px var(--sans); color:var(--taupe); margin-top:20px; }
.lswitch a{ font-weight:800; color:var(--mauve); text-decoration:none; }
.lpartner{ margin-top:14px; padding-top:14px; border-top:1px solid rgba(150,105,87,.16); text-align:center; }
.lpartner > a{ font:700 12.5px var(--sans); color:var(--d-cycle); text-decoration:none; }
.singpass{ font:500 11px var(--sans); color:var(--faded); margin-top:9px; }
.authtab{ display:none; }
.authtab.on{ display:block; animation:rise .5s cubic-bezier(.22,1,.36,1); }
@keyframes rise{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
</style>
</head><body>
<div class="lwrap">
  <div class="aura a1"></div><div class="aura a2"></div><div class="aura a3"></div>
  <div class="lsky" id="lsky"></div>
  <svg class="geo" viewBox="0 0 200 200" fill="none" stroke="var(--mauve)" stroke-width="0.4">
    <circle cx="100" cy="100" r="30"/><circle cx="100" cy="70" r="30"/><circle cx="100" cy="130" r="30"/>
    <circle cx="74" cy="85" r="30"/><circle cx="126" cy="85" r="30"/><circle cx="74" cy="115" r="30"/><circle cx="126" cy="115" r="30"/>
    <circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="61.5"/>
  </svg>
  <div class="stars" id="stars"></div>

  <div class="lstage">
    <div class="lhero"><span class="lhalo"></span>NEMOW</div>
    <h1 class="ltitle" id="ttl">Welcome <em>back.</em></h1>
    <div class="lsub" id="sub">Step back into your rhythm — your cycle has been waiting.</div>

    <div class="lcard">
      <!-- SIGN IN -->
      <div class="authtab on" id="tab-in">
        <div class="field"><span class="ms">mail</span><input type="email" placeholder="Email address" autocomplete="email"/></div>
        <div class="field"><span class="ms">lock</span><input type="password" id="p1" placeholder="Password" autocomplete="current-password"/><span class="ms eye" data-t="p1">visibility_off</span></div>
        <a class="forgot" href="#">Forgot password?</a>
        <button class="lbtn" onclick="location.href='home.html'"><span class="ms" style="font-size:19px">auto_awesome</span> Enter Nemow</button>
      </div>
      <!-- CREATE -->
      <div class="authtab" id="tab-up">
        <div class="field"><span class="ms">person</span><input type="text" placeholder="First name" autocomplete="given-name"/></div>
        <div class="field"><span class="ms">mail</span><input type="email" placeholder="Email address" autocomplete="email"/></div>
        <div class="field"><span class="ms">lock</span><input type="password" id="p2" placeholder="Create a password" autocomplete="new-password"/><span class="ms eye" data-t="p2">visibility_off</span></div>
        <button class="lbtn" onclick="location.href='onboarding.html?start'"><span class="ms" style="font-size:19px">spa</span> Begin my journey</button>
      </div>

      <div class="ldiv">or continue with</div>
      <div class="grid2" style="gap:10px">
        <a class="oauth osocial" href="#"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h5.9a5 5 0 0 1-2.2 3.3v2.8h3.6c2.1-2 3.3-4.9 3.3-8.2z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.6H2.1v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14a6.6 6.6 0 0 1 0-4.2V6.9H2.1a11 11 0 0 0 0 10z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 6.9L5.8 9.8c.9-2.7 3.3-4.4 6.2-4.4z"/></svg> Google</a>
        <a class="oauth" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="#1D1D1F"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8.94-.19 1.84-.86 3.16-.83 1.79.14 3.02.86 3.81 2.17-3.28 1.97-2.5 6.02.75 7.24-.7 1.53-1.61 3.05-2.8 3.59zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg> Apple</a>
      </div>

      <div class="lswitch" id="switchline">New to Nemow? <a href="#" id="switch">Create your account</a></div>
      <div class="lpartner" id="lpartner">
        <a href="partner-code.html">💛 Have a partner code?</a>
        <div style="margin-top:9px"><a href="provider-dashboard.html" style="font:600 11.5px var(--sans);color:var(--taupe);text-decoration:none">Clinician? <b style="color:var(--mauve)">Sign in to the provider portal →</b></a></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // sky image (generated) with graceful fallback to the animated aura
  var sky=document.getElementById('lsky');
  var img=new Image();
  img.onload=function(){ sky.style.backgroundImage="url('assets/login/mystic-sky.jpg')"; sky.classList.add('on'); document.querySelector('.lwrap').classList.add('skyon'); };
  img.src='assets/login/mystic-sky.jpg';

  // twinkling stars
  var s=document.getElementById('stars'), h='';
  for(var i=0;i<26;i++){
    var x=(i*37+13)%100, y=(i*53+7)%62, sz=(2+(i%3)), d=(2.4+(i%5)*0.6).toFixed(1), t=((i%7)*0.4).toFixed(1);
    h+='<i style="left:'+x+'%;top:'+y+'%;width:'+sz+'px;height:'+sz+'px;--d:'+d+'s;--t:'+t+'s"></i>';
  }
  s.innerHTML=h;

  // social buttons: new-account context → onboarding, otherwise straight into the app
  document.querySelectorAll('.osocial').forEach(function(a){ a.addEventListener('click',function(ev){
    ev.preventDefault();
    location.href = document.getElementById('tab-up').classList.contains('on') ? 'onboarding.html?start' : 'home.html';
  }); });

  // password reveal
  document.querySelectorAll('.eye').forEach(function(e){ e.addEventListener('click',function(){
    var inp=document.getElementById(e.dataset.t);
    var show=inp.type==='password'; inp.type=show?'text':'password'; e.textContent=show?'visibility':'visibility_off';
  }); });

  // sign-in ⇄ create toggle (delegated so it survives innerHTML swaps)
  var up=false, line=document.getElementById('switchline');
  line.addEventListener('click',function(ev){
    if(!ev.target.closest('#switch')) return;
    ev.preventDefault(); up=!up;
    document.getElementById('tab-in').classList.toggle('on',!up);
    document.getElementById('tab-up').classList.toggle('on',up);
    document.getElementById('ttl').innerHTML = up ? 'Begin your <em>journey.</em>' : 'Welcome <em>back.</em>';
    document.getElementById('sub').textContent = up ? 'Create your account and let Nemow learn your rhythm.' : 'Step back into your rhythm — your cycle has been waiting.';
    line.innerHTML = up
      ? 'Already with us? <a href="#" id="switch">Sign in</a>'
      : 'New to Nemow? <a href="#" id="switch">Create your account</a>';
  });
})();
</script>
</body></html>
