<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ovuluna</title>
<link rel="icon" type="image/png" href="assets/onboarding/egg.png">
<script>
  // Auth gate: redirect to login if not authenticated
  (function() {
    try {
      var auth = localStorage.getItem('ovuluna_auth');
      var onboard = localStorage.getItem('ovuluna_onboarding');
      if (auth && onboard) {
        var a = JSON.parse(auth);
        var o = JSON.parse(onboard);
        if (a.loggedIn && o.completed) {
          window.location.replace('home.html');
          return;
        }
      }
    } catch(e) {}
    window.location.replace('login.html');
  })();
</script>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:40px;color:#7a5c96">Loading Ovuluna…</p>
</body>
</html>
